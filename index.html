
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Regional Event & Attendance Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Poppins:ital,wght@0,400;0,600;0,700;1,400&family=Pinyon+Script&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['ui-serif', 'Georgia', 'Cambria', '"Times New Roman"', 'Times', 'serif'],
            mono: ['"DM Mono"', '"Fira Code"', 'monospace'],
          },
          extend: {
            colors: {
              primary: '#4B3FE4',
              secondary: '#EDEAE2',
              danger: '#C8182C',
              // Design tokens (Figma "EventFlow" theme)
              background: '#F5F3EE',
              foreground: '#111110',
              card: '#FFFFFF',
              muted: { DEFAULT: '#E8E5DC', foreground: '#6B6860' },
              accent: { DEFAULT: '#4B3FE4', hover: '#3B30C4' },
              destructive: '#C8182C',
              sidebar: '#0F0F0E',
              // Remapped indigo scale → brand indigo #4B3FE4
              indigo: {
                50: '#EEEDFC', 100: '#DFDCFA', 200: '#C3BEF4', 300: '#A29AEC',
                400: '#8B82F0', 500: '#6255E9', 600: '#4B3FE4', 700: '#3B30C4',
                800: '#2F26A0', 900: '#251E7C', 950: '#17124E',
              },
              // Remapped slate scale → warm stone neutrals (same luminance)
              slate: {
                50: '#F5F3EE', 100: '#EDEAE2', 200: '#E0DDD4', 300: '#C5C2BA',
                400: '#9A9890', 500: '#7C7A72', 600: '#6B6860', 700: '#4A4843',
                800: '#2A2926', 900: '#111110', 950: '#0F0F0E',
              },
            },
            borderColor: {
              DEFAULT: 'rgba(0, 0, 0, 0.08)',
              border: 'rgba(0, 0, 0, 0.08)',
            },
            borderRadius: {
              'xl': '0.5rem',
              '2xl': '0.625rem',
              '3xl': '0.75rem',
            },
            boxShadow: {
              sm: '0 1px 2px 0 rgba(0, 0, 0, 0.04)',
              DEFAULT: '0 1px 3px 0 rgba(0, 0, 0, 0.05)',
              md: '0 2px 8px -1px rgba(0, 0, 0, 0.06)',
              lg: '0 4px 16px -2px rgba(0, 0, 0, 0.08)',
              xl: '0 8px 24px -4px rgba(0, 0, 0, 0.10)',
              '2xl': '0 16px 40px -8px rgba(0, 0, 0, 0.14)',
            },
          }
        }
      }
    </script>
    <style>
      /* Bundled Snell Roundhand for the Certificate of Participation title.
         Self-hosting it (rather than relying on a macOS system font) means the
         exact same script face is used on screen, on print, and in exported PDFs. */
      @font-face {
          font-family: 'Snell Roundhand';
          src: url('/fonts/SnellRoundhand-Regular.ttf') format('truetype');
          font-weight: 400;
          font-style: normal;
          font-display: swap;
      }

      html {
          font-size: 16px;
      }

      body {
          font-family: 'Inter', system-ui, sans-serif;
          background-color: #F5F3EE;
          color: #111110;
      }

      /* Slightly scale down rem-based text and spacing on smaller desktop/laptop screens */
      @media (min-width: 1024px) and (max-width: 1366px) {
          html {
              font-size: 15px;
          }
      }

      /* Keep small desktop layouts readable without letting utility text get too tiny */
      @media (min-width: 1024px) and (max-width: 1180px), (min-width: 1024px) and (max-height: 820px) {
          html {
              font-size: 14px;
          }

          .text-xs {
              font-size: max(12px, 0.75rem) !important;
          }

          .text-sm {
              font-size: max(13px, 0.875rem) !important;
          }

          .text-base {
              font-size: max(14px, 1rem) !important;
          }
      }

      /* Compact density tuning for common laptop-size desktop screens */
      @media (min-width: 1024px) and (max-width: 1600px) and (max-height: 920px) {
          .desktop-compact-shell .app-sidebar.app-sidebar-expanded {
              width: 250px !important;
          }

          .desktop-compact-shell .app-sidebar.app-sidebar-collapsed {
              width: 70px !important;
          }

          .desktop-compact-shell .app-sidebar-footer,
          .desktop-compact-shell .app-main {
              padding: 1.5rem !important;
          }

          .desktop-compact-shell .app-sidebar-header {
              padding: 1.5rem 1rem !important;
          }

          .desktop-compact-shell .app-main-header {
              margin-bottom: 1.5rem !important;
          }

          .desktop-compact-shell .app-sidebar-title {
              font-size: 1.5rem !important;
          }

          .desktop-compact-shell .app-page-title {
              font-size: 1.75rem !important;
          }

          .desktop-compact-shell .app-nav-label,
          .desktop-compact-shell .app-profile-greeting {
              font-size: 0.95rem !important;
          }

          .desktop-compact-shell .app-profile-avatar {
              width: 2.75rem !important;
              height: 2.75rem !important;
              font-size: 1rem !important;
          }

          .attendance-page {
              gap: 0.625rem !important;
          }

          .attendance-page .attendance-toolbar {
              padding: 0.875rem !important;
          }

          .attendance-page .attendance-stats {
              padding-bottom: 0.125rem !important;
          }

          .events-stat-card {
              padding: 0.5rem !important;
              min-width: 0 !important;
              min-height: 64px !important;
          }

          .attendance-page .attendance-stat-card {
              padding: 0.5rem !important;
              min-width: 0 !important;
              min-height: 64px !important;
          }

          .events-stat-value {
              font-size: 0.95rem !important;
              line-height: 1.1 !important;
          }

          .attendance-page .attendance-stat-value {
              font-size: 0.95rem !important;
              line-height: 1.1 !important;
          }

          .attendance-page .attendance-table thead th,
          .attendance-page .attendance-table tbody td {
              padding: 0.85rem 1rem !important;
          }

          .attendance-page .attendance-table tbody td .bg-green-100,
          .attendance-page .attendance-table tbody td .bg-indigo-100 {
              padding: 0.35rem 0.5rem !important;
          }
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        .page-break-after {
            page-break-after: always;
            break-after: page;
        }
        body {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        @page {
            margin: 0.5cm;
            size: landscape;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "recharts": "https://esm.sh/recharts@^3.7.0",

    "react-qr-code": "https://esm.sh/react-qr-code@^2.0.18",
    "date-fns": "https://esm.sh/date-fns@^4.1.0",
    "bcryptjs": "https://esm.sh/bcryptjs@2.4.3",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.95.3",
    "react-router": "https://esm.sh/react-router@^7.13.0",
    "html-to-image": "https://esm.sh/html-to-image@1.11.11"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
           <script type="module" src="/index.tsx"></script>
  </body>
</html>
